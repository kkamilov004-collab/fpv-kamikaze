@font-face{font-family:"IBM Plex Mono";font-weight:700;font-display:swap;src:url(fonts/ibm-plex-mono-cyrillic-700-normal.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}

/* Layout: full-screen game canvas, menus as stacked panels over it; one deliberately dark "field terminal" look */
:root{
  --bg:#0f120d; --panel:#181d15; --panel2:#20271c; --line:#3a4430;
  --fg:#e4e6d6; --dim:#97a08a; --accent:#e9b43c; --danger:#ff4d3a; --ok:#7fd05a;
  --f-display:"Russo One","Arial Black",system-ui,sans-serif;
  --f-body:"PT Sans Narrow","Arial Narrow",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden}
body{font-family:var(--f-body);font-size:16px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;background:#000}
.layer{position:fixed;inset:0;touch-action:none}
/* ---------- menus ---------- */
.screen{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;
  background:radial-gradient(120% 90% at 70% 0%,#26301f 0%,var(--bg) 60%);
  padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 20px) max(16px,env(safe-area-inset-left,0px));box-sizing:border-box}
.screen.glass{background:rgba(10,12,9,.82);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top h2{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0;flex:1;letter-spacing:.02em}
.coins{font-family:var(--f-mono);font-weight:700;color:var(--accent);background:var(--panel);border:1px solid var(--line);padding:6px 10px;border-radius:4px;white-space:nowrap}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:10px 16px;font-weight:700;font-size:16px;letter-spacing:.04em;text-transform:uppercase}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:#1a1405;border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.4;cursor:default}
.title-block{padding-block:4vh 1vh}
.logo{font-family:var(--f-display);font-size:clamp(40px,9vw,92px);line-height:.9;margin:0;letter-spacing:-.01em;text-wrap:balance}
.logo span{color:var(--accent);display:block;font-size:13px;letter-spacing:.24em;margin-bottom:.35em;font-family:var(--f-mono)}
.tag{color:var(--dim);font-size:18px;max-width:52ch;margin:10px 0 0}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.mbtn{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.mbtn b{font-family:var(--f-display);font-weight:400;font-size:20px}
.mbtn small{color:var(--dim);font-size:15px}
.mbtn.main{background:var(--accent);color:#1a1405;border-color:var(--accent)}
.mbtn.main small{color:#4a3a10}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:12px;display:flex;flex-direction:column;gap:8px;text-align:left;min-width:0}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.card h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:18px}
.card .kind{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--accent);text-transform:uppercase}
.card p{margin:0;color:var(--dim);font-size:14px;line-height:1.3}
.stat{display:grid;grid-template-columns:96px 1fr 52px;gap:6px;align-items:center;font-size:13px}
.stat .bar{height:6px;background:#0b0d09;border-radius:2px;overflow:hidden}
.stat .bar i{display:block;height:100%;background:var(--accent)}
.stat .v{font-family:var(--f-mono);font-size:11px;text-align:right;color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{font-size:14px;padding:7px 10px;border:1px solid var(--line);border-radius:3px;background:var(--panel2)}
.chip.on{background:var(--accent);color:#1a1405;border-color:var(--accent);font-weight:700}
.chip[disabled]{opacity:.35}
.mapthumb{height:64px;border-radius:3px;position:relative;overflow:hidden}
.diff{font-family:var(--f-mono);font-size:12px;color:var(--accent)}
.note{color:var(--dim);font-size:14px}
.section-h{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;margin:6px 0 -4px}
.res-big{font-family:var(--f-display);font-size:clamp(34px,7vw,64px);margin:0}
.stars{font-size:36px;color:var(--accent);letter-spacing:.1em}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-family:var(--f-mono);font-size:14px;max-width:420px}
/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;font-family:var(--f-mono);font-weight:700;color:#fff;
  text-shadow:0 0 2px #000,0 0 2px #000,1px 1px 0 #000}
#noise{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;pointer-events:none;opacity:.08}
#scan{position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
#vign{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}
.osd{position:absolute;font-size:clamp(12px,1.7vw,16px);line-height:1.25;white-space:nowrap}
.osd.tl{left:calc(env(safe-area-inset-left,0px) + 14px);top:calc(env(safe-area-inset-top,0px) + 10px)}
.osd.tr{right:calc(env(safe-area-inset-right,0px) + 14px);top:calc(env(safe-area-inset-top,0px) + 10px);text-align:right}
.osd.bl{left:calc(env(safe-area-inset-left,0px) + 14px);bottom:calc(env(safe-area-inset-bottom,0px) + 10px)}
.osd.br{right:calc(env(safe-area-inset-right,0px) + 14px);bottom:calc(env(safe-area-inset-bottom,0px) + 10px);text-align:right}
.osd.bc{left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 10px);text-align:center}
.osd.tc{left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 8px);text-align:center}
#compass{position:relative;width:min(46vw,420px);height:22px;overflow:hidden;border-bottom:1px solid rgba(255,255,255,.6)}
#compass span{position:absolute;top:2px;transform:translateX(-50%);font-size:12px}
#compass .tg{color:var(--danger)}
#cross{position:absolute;left:50%;top:50%;width:34px;height:34px;transform:translate(-50%,-50%)}
#cross:before,#cross:after{content:"";position:absolute;background:#fff;box-shadow:0 0 2px #000}
#cross:before{left:16px;top:0;width:2px;height:34px}
#cross:after{top:16px;left:0;height:2px;width:34px}
#warn{position:absolute;left:50%;top:30%;transform:translateX(-50%);font-size:clamp(16px,2.6vw,26px);color:var(--danger);text-align:center}
#big{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font-family:var(--f-display);font-weight:400;font-size:clamp(26px,5vw,52px);text-align:center;white-space:pre-line}
#sub{position:absolute;left:50%;top:58%;transform:translateX(-50%);font-size:clamp(13px,2vw,18px);text-align:center;white-space:pre-line}
#marks{position:absolute;inset:0}
.mk{position:absolute;transform:translate(-50%,-50%);color:var(--danger);font-size:11px;text-align:center}
.mk i{display:block;width:18px;height:18px;margin:0 auto 1px;border:2px solid var(--danger);transform:rotate(45deg)}
.mk.dead{color:#aaa}.mk.dead i{border-color:#aaa;border-style:dashed}
.mk.ew{color:#c58bff}.mk.ew i{border-color:#c58bff}
#mini{position:absolute;right:calc(env(safe-area-inset-right,0px) + 14px);top:calc(env(safe-area-inset-top,0px) + 58px);width:clamp(90px,15vw,140px);height:clamp(90px,15vw,140px);border:1px solid rgba(255,255,255,.5);background:rgba(0,0,0,.35)}
.lowbat{color:var(--danger)}
#hud.obs .osd,#hud.obs #mini,#hud.obs #marks,#hud.obs #warn{display:none}
#hud.obs:before{content:"● REC  ОБЪЕКТИВНЫЙ КОНТРОЛЬ · ВИД С РАЗВЕДЧИКА";position:absolute;left:calc(env(safe-area-inset-left,0px) + 14px);top:calc(env(safe-area-inset-top,0px) + 12px);font-size:13px;color:#ff5a4a}
/* tank hud */
.tbar{width:min(30vw,220px);height:8px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.6);margin-top:3px}
.tbar i{display:block;height:100%;background:var(--ok)}
#arrows{position:absolute;inset:0}
.arr{position:absolute;left:50%;top:50%;width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:18px solid var(--danger)}
/* controls */
#ctrls{position:fixed;inset:0;pointer-events:none}
.stick{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(0,0,0,.15)}
.stick i{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:rgba(255,255,255,.45)}
.hbtn{position:absolute;pointer-events:auto;border-radius:50%;border:2px solid rgba(255,255,255,.55);background:rgba(0,0,0,.4);color:#fff;font-family:var(--f-mono);font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.1}
.hbtn.on{background:rgba(197,139,255,.55)}
.hbtn.fire{background:rgba(255,77,58,.5)}
#pauseBtn{left:calc(env(safe-area-inset-left,0px) + 12px);top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:6px;font-size:16px}
#rot{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;z-index:50}
#rot b{font-family:var(--f-display);font-weight:400;font-size:24px}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);font-family:var(--f-mono);z-index:60}
@media (max-height:520px){.logo{font-size:44px}.title-block{padding-block:0}.tag{font-size:15px;margin-top:6px}.mbtn{padding:10px 14px}.mbtn b{font-size:17px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<canvas id="gl"></canvas>
<canvas id="noise" width="160" height="90" hidden></canvas>
<div id="scan" hidden></div><div id="vign" hidden></div>

<div id="hud" hidden>
  <div id="marks"></div><div id="arrows"></div>
  <div class="osd tl" id="oTL"></div>
  <div class="osd tc"><div id="compass"></div><div id="oTC"></div></div>
  <div class="osd tr" id="oTR"></div>
  <canvas id="mini" width="140" height="140"></canvas>
  <div id="cross"></div>
  <div id="warn"></div>
  <div id="big"></div><div id="sub"></div>
  <div class="osd bl" id="oBL"></div>
  <div class="osd bc" id="oBC"></div>
  <div class="osd br" id="oBR"></div>
</div>
<div id="ctrls" hidden>
  <div class="stick" id="stL" hidden><i></i></div>
  <div class="stick" id="stR" hidden><i></i></div>
  <div id="tbtns"></div>
  <button class="hbtn" id="pauseBtn" aria-label="Пауза">II</button>
</div>

<div class="screen" id="scrMenu" hidden></div>
<div class="screen" id="scrHangar" hidden></div>
<div class="screen" id="scrMaps" hidden></div>
<div class="screen" id="scrSettings" hidden></div>
<div class="screen glass" id="scrPause" hidden></div>
<div class="screen glass" id="scrResult" hidden></div>
<div id="rot" hidden><b>Поверни телефон</b><span class="note">FPV Камикадзе играется в горизонтальном режиме</span></div>
<div id="loading">ЗАГРУЗКА…</div>

<script src="lib/three.min.js"></script>
<script src="data.js"></script>
<script src="audio.js"></script>
<script src="world.js"></script>
<script src="fx.js"></script>
<script src="flight.js"></script>
<script src="tank.js"></script>
<script src="ui.js"></script>
